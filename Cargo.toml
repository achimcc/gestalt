[package]
name = "gestalt"
version = "0.4.2"
edition = "2024"
license = "AGPL-3.0-only"
description = "Show the shape of a document (JSON, YAML, TOML, INI, .env, unit files) without showing its values"
repository = "https://github.com/achimcc/gestalt"
readme = "README.md"
keywords = ["json", "secrets", "schema", "cli"]
categories = ["command-line-utilities"]

[dependencies]
indexmap = "2"
lexopt = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
sha2 = "0.10"
toml = { version = "0.9", features = ["preserve_order"] }

[lints.rust]
# No `unsafe` anywhere in this crate, and no `#[allow]` can bring it back.
unsafe_code = "forbid"

[profile.release]
lto = true
